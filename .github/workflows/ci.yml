name: PrintMate Continuous Integration

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  commit-message-lint:
    name: commit-message-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate Conventional Commits
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_HEAD: ${{ github.sha }}
          PR_BASE_REF: ${{ github.base_ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          chmod +x scripts/check-commit-messages.sh

          if [ "$EVENT_NAME" = "pull_request" ]; then
            ./scripts/check-commit-messages.sh "origin/$PR_BASE_REF" "$PR_HEAD_SHA"
          else
            ./scripts/check-commit-messages.sh "$PUSH_BEFORE" "$PUSH_HEAD"
          fi

  build-and-test:
    name: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "maven"

      - name: Run Build, Unit & Integration Tests with JaCoCo
        run: |
          chmod +x mvnw
          ./mvnw clean verify -B

      - name: Upload JaCoCo Coverage Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-coverage-report
          path: target/site/jacoco/
          retention-days: 14

  docker-build:
    name: docker-build
    runs-on: ubuntu-latest
    needs: [build-and-test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Compose Configuration
        run: |
          export DB_PASSWORD="$(openssl rand -hex 32)"
          export ADMIN_PASSWORD="$(openssl rand -hex 32)"
          export OPERATOR_PASSWORD="$(openssl rand -hex 32)"
          export GRAFANA_ADMIN_PASSWORD="$(openssl rand -hex 32)"
          docker compose config --quiet

      - name: Build Application Docker Image
        run: |
          docker build -t printmate:ci-test .

  deploy-render:
    name: deploy-render
    runs-on: ubuntu-latest
    needs: [build-and-test, docker-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Trigger Render deployment
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "RENDER_DEPLOY_HOOK_URL secret is not configured" >&2
            exit 1
          fi
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL"
