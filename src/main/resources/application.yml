server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
    include-binding-errors: always

management:
  server:
    port: ${MANAGEMENT_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true

spring:
  application:
    name: printmate
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:printmate}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:printmate_user}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 15
      minimum-idle: 3
      idle-timeout: 300000
      connection-timeout: 20000
      pool-name: PrintMateHikariPool
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: Asia/Dhaka
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 30MB

printmate:
  currency: BDT
  timezone: Asia/Dhaka
  upload-dir: ${UPLOAD_DIR:./uploads}
  max-copies: 100
  pickup-code:
    validity-hours: 72
    max-attempts: 5
  pricing:
    bulk-discount-threshold: 50
    bulk-discount-rate: 0.10
  monitoring:
    prometheus-url: ${PROMETHEUS_PUBLIC_URL:}
    grafana-url: ${GRAFANA_PUBLIC_URL:}
  security:
    admin:
      auto-create: ${ADMIN_AUTO_CREATE:false}
      name: ${ADMIN_NAME:System Administrator}
      email: ${ADMIN_EMAIL:admin@printmate.com}
      password: ${ADMIN_PASSWORD:}
      phone: ${ADMIN_PHONE:+8801700000000}
    operator:
      auto-create: ${OPERATOR_AUTO_CREATE:false}
      name: ${OPERATOR_NAME:Shop Operator}
      email: ${OPERATOR_EMAIL:operator@printmate.com}
      password: ${OPERATOR_PASSWORD:}
      phone: ${OPERATOR_PHONE:+8801800000000}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
